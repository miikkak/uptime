---
name: PR Validation

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  ci-cd:
    uses: miikkak/workflows/.github/workflows/ci-cd.yml@a6cb37ae4c8b177c5d36cd9c8d7f82ae1b9b3367 # main
    with:
      code-paths: >-
        '**/*.java', '**/*.kts', 'gradle.properties', 'gradle/wrapper/**',
        '.github/workflows/**', '.pre-commit-config.yaml', '.releaserc.json'
